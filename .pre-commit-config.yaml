# Git-хуки. Всё запускается из nix develop (инструменты из flake.nix), из сети ничего не качается.
#   включить один раз:  nix develop -c pre-commit install
#   вручную:            nix develop -c pre-commit run --all-files
#                       nix develop -c pre-commit run --hook-stage pre-push --all-files
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # --- перед коммитом: быстро, только изменённые файлы ---
      - id: trailing-whitespace
        name: пробелы в конце строк
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
        exclude: \.md$
      - id: end-of-file
        name: перевод строки в конце файла
        entry: end-of-file-fixer
        language: system
        types: [text]
      - id: check-toml
        name: TOML читается
        entry: check-toml
        language: system
        types: [toml]
      - id: check-yaml
        name: YAML читается
        entry: check-yaml
        language: system
        types: [yaml]
      - id: merge-conflicts
        name: нет следов конфликтов слияния
        entry: check-merge-conflict
        language: system
        types: [text]
      - id: large-files
        name: нет больших файлов (записи, модели)
        entry: check-added-large-files --maxkb=1024
        language: system
      - id: private-key
        name: нет приватных ключей
        entry: detect-private-key
        language: system
        types: [text]
      - id: secrets
        name: нет ключей API и паролей
        entry: python scripts/guard.py secrets
        language: system
        types: [text]
      - id: private-words
        name: нет личных данных (.git/info/private-words)
        entry: python scripts/guard.py private
        language: system
        types: [text]
      - id: ruff
        name: ruff (ошибки, импорты, современный синтаксис)
        entry: ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
      - id: mypy
        name: mypy (домен и сценарии)
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false

      # --- перед пушем: всё целиком ---
      - id: pytest
        name: все тесты (включая границы слоёв)
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: private-words-all
        name: нет личных данных во всём репозитории
        entry: python scripts/guard.py private
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
