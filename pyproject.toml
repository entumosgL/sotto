[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sotto"
version = "0.2.0"
description = "Невидимый ИИ-суфлёр для собеседований: Linux/Hyprland и Windows 11 — подсказки, запись, поиск, тренеры, вакансии"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi", "uvicorn", "httpx", "jinja2", "python-multipart", "pydantic",
  "numpy", "faster-whisper", "fastembed", "sqlite-vec",
  # Озвучка тренеров: Piper-голоса через sherpa-onnx. Версия < 2 обязательна — в sherpa-onnx 2.x
  # убран espeak-фронтенд, и Piper-голоса без готовых фонем перестают звучать.
  "sherpa-onnx<2",
  "PySide6", "telethon", "playwright", "markdown",
  # Linux: PDF резюме рендерит WeasyPrint (нужны системные pango/cairo из дистрибутива).
  "weasyprint; sys_platform != 'win32'",
  # Windows: WASAPI-захват (микрофон и системный звук), снимки экрана и JPEG.
  # PDF резюме там печатается Edge/Chrome в headless-режиме, поэтому WeasyPrint не нужен.
  "soundcard; sys_platform == 'win32'",
  "mss; sys_platform == 'win32'",
  "pillow; sys_platform == 'win32'",
]

[project.scripts]
sotto = "sotto.cli:main"

[tool.setuptools.packages.find]
include = ["sotto*"]

[tool.setuptools.package-data]
sotto = ["web/templates/*.html", "web/static/*", "prompts/*.md", "sim/scenarios/*.toml", "experimental/translator/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
